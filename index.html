<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIDEON. — Videos con IA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='24' fill='%238b5cf6'/></svg>">
<style>
:root{
  --bg:#000; --fg:#fafafa; --muted:#8a8a93; --line:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.05); --glass-hi:rgba(255,255,255,.09);
  --accent:#8b5cf6; --accent-soft:rgba(139,92,246,.35); --btn-bg:#fafafa; --btn-fg:#000;
  --shadow:0 30px 80px -30px rgba(139,92,246,.35);
}
:root[data-theme="light"]{
  --bg:#fff; --fg:#0a0a0a; --muted:#6b6b75; --line:rgba(0,0,0,.1);
  --glass:rgba(0,0,0,.035); --glass-hi:rgba(0,0,0,.06);
  --accent:#7c3aed; --accent-soft:rgba(124,58,237,.25); --btn-bg:#0a0a0a; --btn-fg:#fff;
  --shadow:0 30px 80px -30px rgba(124,58,237,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:"Inter","Geist","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  transition:background .3s,color .3s;
}
body::before{ /* halo sutil detrás del input */
  content:"";position:fixed;left:50%;top:38%;width:min(900px,120vw);height:420px;
  transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--accent-soft),transparent);
  opacity:.45;filter:blur(40px);pointer-events:none;z-index:0;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
.logo{display:flex;align-items:baseline;font-size:22px;font-weight:800;letter-spacing:-.04em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-left:3px;align-self:flex-end;margin-bottom:5px;position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3.2);opacity:0}}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);transition:background .2s}
.icon-btn:hover{background:var(--glass-hi)}
.icon-btn svg{width:18px;height:18px}
:root[data-theme="dark"] .i-moon,:root[data-theme="light"] .i-sun{display:none}

main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:6vh 20px 80px}
h1{font-size:clamp(34px,6vw,54px);font-weight:600;letter-spacing:-.045em;text-align:center;line-height:1.05;margin-bottom:34px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.composer{
  background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:16px 16px 12px;
  backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s;
}
.composer:focus-within{border-color:var(--accent-soft)}
textarea{width:100%;min-height:84px;max-height:240px;resize:none;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:18px;line-height:1.5;padding:6px 8px}
textarea::placeholder{color:var(--muted)}
.attach{display:none;align-items:center;gap:10px;padding:6px 8px 10px}
.attach.on{display:flex}
.attach img{width:52px;height:52px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.attach span{font-size:13px;color:var(--muted)}
.attach button{margin-left:auto;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px}
.attach button:hover{background:var(--glass-hi);color:var(--fg)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
.pill:hover{background:var(--glass-hi)}
.pill svg{width:16px;height:16px}
select.pill{appearance:none;-webkit-appearance:none;padding-right:14px;color:inherit;max-width:100%}
select.pill option{background:#111;color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--glass)}
.seg button{height:30px;padding:0 14px;border-radius:999px;font-size:14px;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;transition:transform .15s,opacity .2s}
.go:hover:not(:disabled){transform:scale(1.06)}
.go:disabled{opacity:.35;cursor:not-allowed}
.go svg{width:20px;height:20px}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted);background:transparent;transition:all .2s}
.chip:hover{color:var(--fg);background:var(--glass-hi);border-color:var(--accent-soft)}

/* Resultado */
.result{display:none;margin-top:30px;border:1px solid var(--line);border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);overflow:hidden}
.result.on{display:block;animation:rise .5s both}
.prog{padding:20px 22px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.prog-label{font-size:15px}
.prog-pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.track{height:4px;border-radius:4px;background:var(--glass-hi);overflow:hidden;position:relative}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#c4b5fd);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fill.run::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 1.6s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prog-foot{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--muted)}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkbtn:hover{color:var(--fg)}
.err{color:#f87171}
video{display:none;width:100%;background:#000;max-height:70vh}
.actions{display:none;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.actions a,.actions button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:14px;display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.actions a:hover,.actions button:hover{background:var(--glass-hi)}

.hist{margin-top:54px}
.hist h2{font-size:15px;font-weight:500;color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--glass);text-align:left;transition:border-color .2s}
.card:hover{border-color:var(--accent-soft)}
.card video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;max-height:none}
.card p{padding:10px 12px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;padding:0 20px 28px}

@media (max-width:560px){
  header{padding:16px 18px}
  textarea{font-size:16px}
  .bar{gap:6px}
  .pill{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="logo" aria-label="VIDEON">VIDEON<span class="dot" aria-hidden="true"></span></div>
  <button class="icon-btn" id="theme" aria-label="Cambiar tema">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<main>
  <h1>¿Qué quieres crear?</h1>

  <section class="composer" aria-label="Generador de video">
    <textarea id="prompt" placeholder="Describe tu video: un astronauta caminando en Marte, polvo flotando, cinemático…" aria-label="Prompt"></textarea>

    <div class="attach" id="attach">
      <img id="thumb" alt="Imagen de referencia">
      <span id="fileinfo"></span>
      <button type="button" id="rmimg">Quitar</button>
    </div>

    <div class="bar">
      <button type="button" class="pill" id="pick" aria-label="Adjuntar imagen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
        Imagen
      </button>
      <input type="file" id="file" accept="image/*" hidden>

      <select class="pill" id="model" aria-label="Modelo">
        <option value="veo-3.1-fast-hd">VEO 3.1 Fast HD</option>
        <option value="grok-video-3">Grok Video 3</option>
        <option value="seedance-2-fast">Seedance 2 Fast</option>
      </select>

      <div class="seg" role="group" aria-label="Duración">
        <button type="button" data-d="5" aria-pressed="false">5s</button>
        <button type="button" data-d="10" aria-pressed="true">10s</button>
      </div>

      <button type="button" class="go" id="go" aria-label="Generar video" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </section>

  <div class="chips" id="chips"></div>

  <section class="result" id="result" aria-live="polite">
    <div class="prog" id="prog">
      <div class="prog-top"><span class="prog-label" id="plabel">Enviando…</span><span class="prog-pct" id="ppct">0%</span></div>
      <div class="track"><div class="fill run" id="fill"></div></div>
      <div class="prog-foot"><span id="ptime">0s</span><button type="button" class="linkbtn" id="cancel">Cancelar</button></div>
    </div>
    <video id="vid" controls playsinline loop></video>
    <div class="actions" id="actions">
      <a id="dl" target="_blank" rel="noopener" download>Descargar</a>
      <button type="button" id="again">Crear otro</button>
    </div>
  </section>

  <section class="hist" id="hist" hidden>
    <h2>Tus videos recientes</h2>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>Los enlaces de video pueden caducar. Descarga lo que quieras conservar.</footer>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const root=document.documentElement;
  const el={prompt:$('prompt'),go:$('go'),model:$('model'),file:$('file'),pick:$('pick'),attach:$('attach'),thumb:$('thumb'),fileinfo:$('fileinfo'),
    rm:$('rmimg'),result:$('result'),fill:$('fill'),plabel:$('plabel'),ppct:$('ppct'),ptime:$('ptime'),cancel:$('cancel'),prog:$('prog'),
    vid:$('vid'),actions:$('actions'),dl:$('dl'),again:$('again'),chips:$('chips'),hist:$('hist'),grid:$('grid')};

  const store={
    get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
  };

  /* ---------- Tema ---------- */
  const saved=store.get('videon-theme',null);
  root.dataset.theme=saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  $('theme').onclick=()=>{const t=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=t;store.set('videon-theme',t)};

  /* ---------- Sugerencias ---------- */
  const ideas=[
    'Astronauta caminando en Marte al amanecer, polvo flotando',
    'Dron sobrevolando un fiordo noruego entre niebla',
    'Gato samurái bajo la lluvia de neón, estilo cyberpunk',
    'Ola gigante rompiendo en cámara lenta, luz dorada',
    'Calle de Tokio de noche, reflejos en el asfalto mojado'
  ];
  ideas.forEach(t=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t.split(',')[0];
    b.onclick=()=>{el.prompt.value=t;sync();el.prompt.focus()};
    el.chips.appendChild(b);
  });

  /* ---------- Entrada ---------- */
  let duration=10,img64=null,busy=false,abort=null;
  function sync(){
    el.prompt.style.height='auto';el.prompt.style.height=Math.min(el.prompt.scrollHeight,240)+'px';
    el.go.disabled=busy||!el.prompt.value.trim();
  }
  el.prompt.addEventListener('input',sync);
  el.prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&!el.go.disabled)run()});
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    duration=+b.dataset.d;
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  });
  el.model.value=store.get('videon-model',el.model.value);
  el.model.onchange=()=>store.set('videon-model',el.model.value);

  /* ---------- Imagen (se comprime para no pasar el límite de 4.5MB de Vercel) ---------- */
  el.pick.onclick=()=>el.file.click();
  el.file.onchange=()=>{
    const f=el.file.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=1280,s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        img64=c.toDataURL('image/jpeg',.85);
        el.thumb.src=img64;el.fileinfo.textContent=f.name+' · imagen de referencia';el.attach.classList.add('on');
      };
      im.onerror=()=>alert('No se pudo leer esa imagen.');
      im.src=reader.result;
    };
    reader.readAsDataURL(f);
  };
  el.rm.onclick=()=>{img64=null;el.file.value='';el.attach.classList.remove('on')};

  /* ---------- Progreso ---------- */
  let t0=0,tick=null,realPct=null;
  function setPct(p,label){
    p=Math.max(0,Math.min(100,p));
    el.fill.style.width=p+'%';el.ppct.textContent=Math.round(p)+'%';
    if(label)el.plabel.textContent=label;
  }
  function startClock(){
    t0=Date.now();
    tick=setInterval(()=>{
      const s=(Date.now()-t0)/1000;
      el.ptime.textContent=Math.floor(s)+'s';
      // Si la API no da porcentaje real, se estima con una curva que nunca llega al 100%
      const est=92*(1-Math.exp(-s/(duration===10?55:35)));
      setPct(realPct!==null?realPct:est);
    },500);
  }
  const stopClock=()=>{clearInterval(tick);tick=null};

  /* ---------- Helpers de respuesta ---------- */
  const pickUrl=d=>{
    if(!d)return null;
    const c=[d.data?.url,d.url,d.video_url,d.data?.video_url,d.output?.url,d.output?.video_url,d.result?.url,
      d.data?.videos?.[0]?.url,d.videos?.[0]?.url,d.data?.[0]?.url,Array.isArray(d.output)?d.output[0]:null];
    return c.find(x=>typeof x==='string'&&x.startsWith('http'))||null;
  };
  const pickStatus=d=>String(d?.status||d?.data?.status||d?.state||'').toLowerCase();
  const pickProgress=d=>{
    const p=d?.progress??d?.data?.progress??d?.percent;
    const n=typeof p==='string'?parseFloat(p):p;
    if(typeof n!=='number'||isNaN(n))return null;
    return n<=1?n*100:n;
  };
  const sleep=(ms,sig)=>new Promise((res,rej)=>{
    const t=setTimeout(res,ms);
    sig.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('abort','AbortError'))},{once:true});
  });
  const errMsg=d=>typeof d?.error==='string'?d.error:d?.error?.message||d?.message||'Error desconocido';

  /* ---------- Generar ---------- */
  async function run(){
    const prompt=el.prompt.value.trim();if(!prompt||busy)return;
    busy=true;abort=new AbortController();realPct=null;sync();
    el.result.classList.add('on');el.prog.style.display='block';
    el.vid.style.display='none';el.vid.removeAttribute('src');el.actions.style.display='none';
    el.fill.classList.add('run');el.plabel.classList.remove('err');
    setPct(2,'Enviando a '+el.model.selectedOptions[0].textContent+'…');startClock();
    el.result.scrollIntoView({behavior:'smooth',block:'nearest'});

    try{
      const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},signal:abort.signal,
        body:JSON.stringify({prompt,image:img64,model:el.model.value,duration})});
      const data=await res.json().catch(()=>({error:'Respuesta no válida del servidor ('+res.status+')'}));
      if(!res.ok)throw new Error(errMsg(data));

      let url=pickUrl(data);
      const id=data.id||data.data?.id||data.task_id||data.data?.task_id;
      if(!url&&!id)throw new Error('La API no devolvió ni video ni ID: '+JSON.stringify(data).slice(0,200));

      if(!url){
        setPct(6,'En cola…');
        const MAX=5*60*1000;
        while(!url){
          await sleep(3000,abort.signal);
          if(Date.now()-t0>MAX)throw new Error('Tardó demasiado (más de 5 min). Inténtalo de nuevo.');
          const rs=await fetch('/api/status?id='+encodeURIComponent(id),{signal:abort.signal});
          const ds=await rs.json().catch(()=>({}));
          if(!rs.ok&&rs.status>=400&&rs.status<500)throw new Error(errMsg(ds));
          const st=pickStatus(ds);
          if(/fail|error|cancel|reject/.test(st))throw new Error(errMsg(ds)!=='Error desconocido'?errMsg(ds):'La generación falló ('+st+')');
          realPct=pickProgress(ds);
          url=pickUrl(ds);
          if(!url){
            el.plabel.textContent=/queue|pending|submit/.test(st)?'En cola…':'Generando tu video…';
          }
        }
      }
      finish(url,prompt);
    }catch(e){
      stopClock();el.fill.classList.remove('run');
      if(e.name==='AbortError'){el.result.classList.remove('on')}
      else{el.plabel.textContent='❌ '+e.message;el.plabel.classList.add('err');el.ppct.textContent='';}
    }finally{
      busy=false;abort=null;sync();
    }
  }

  function finish(url,prompt){
    stopClock();realPct=null;setPct(100,'Listo');el.fill.classList.remove('run');
    setTimeout(()=>{
      el.prog.style.display='none';
      el.vid.src=url;el.vid.style.display='block';el.vid.play().catch(()=>{});
      el.dl.href=url;el.actions.style.display='flex';
    },450);
    const h=store.get('videon-history',[]);
    h.unshift({url,prompt,t:Date.now()});store.set('videon-history',h.slice(0,12));
    renderHist();
  }

  el.go.onclick=run;
  el.cancel.onclick=()=>{if(abort)abort.abort();stopClock()};
  el.again.onclick=()=>{el.result.classList.remove('on');el.prompt.focus();window.scrollTo({top:0,behavior:'smooth'})};

  /* ---------- Historial ---------- */
  function renderHist(){
    const h=store.get('videon-history',[]);
    el.grid.replaceChildren();
    el.hist.hidden=!h.length;
    h.forEach(it=>{
      const b=document.createElement('button');b.type='button';b.className='card';
      const v=document.createElement('video');v.src=it.url;v.muted=true;v.preload='metadata';v.playsInline=true;
      b.onmouseenter=()=>v.play().catch(()=>{});b.onmouseleave=()=>{v.pause();v.currentTime=0};
      const p=document.createElement('p');p.textContent=it.prompt;
      b.append(v,p);
      b.onclick=()=>{el.result.classList.add('on');el.prog.style.display='none';el.vid.src=it.url;el.vid.style.display='block';
        el.dl.href=it.url;el.actions.style.display='flex';el.result.scrollIntoView({behavior:'smooth',block:'center'})};
      el.grid.appendChild(b);
    });
  }
  renderHist();sync();
})();
</script>
</body>
</html>
